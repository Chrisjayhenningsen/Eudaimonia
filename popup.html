<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 20px;
      margin: 0 0 20px 0;
      color: #333;
    }
    
    .token-display {
      background: #f0f7ff;
      border: 2px solid #4a9eff;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .token-count {
      font-size: 32px;
      font-weight: bold;
      color: #4a9eff;
    }
    
    .token-label {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section h2 {
      font-size: 16px;
      margin: 0 0 10px 0;
      color: #555;
    }
    
    button {
      background: #4a9eff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      font-weight: 500;
    }
    
    button:hover {
      background: #3a8eef;
    }
  </style>
</head>
<body>
  <div style="text-align: center; margin-bottom: 15px;">
    <img src="Eudaimonia_logo.png" alt="Eudaimonia" style="width: 60px; height: 60px;">
  </div>
  <h1>&#127919; SelfDev Goal Tracker</h1>
  
  <div class="token-display" id="tokenBox" style="cursor: pointer; transition: background 0.2s, transform 0.1s;" title="Click to buy more tokens">
    <div class="token-count" id="tokenCount">0</div>
    <div class="token-label">Tokens</div>
    <div style="font-size: 10px; color: #4a9eff; opacity: 0.7; margin-top: 3px;">click to top up &#43;</div>
  </div>
  
  <button id="profileBtn" style="margin-bottom: 10px; background: #4a9eff;">
    &#9999;&#65039; Edit Profile
  </button>
  
  <button id="checkinBtn" style="margin-bottom: 10px; background: #51cf66;">
    &#10003; Check In
  </button>
  
  <button id="promoteBtn" style="margin-bottom: 20px; background: #ff8800;">
    &#128640; Promote Link
  </button>
  
  <div class="section">
    <h2>Your Goals &amp; Systems</h2>
    
    <div id="moveTowardSection" style="margin-bottom: 15px;">
      <div style="font-weight: 500; color: #4a9eff; margin-bottom: 5px;">Long Term Goals:</div>
      <div id="moveTowardText" style="color: #666; font-size: 14px; line-height: 1.5;"></div>
    </div>
    
    <div id="moveAwaySection" style="margin-bottom: 15px;">
      <div style="font-weight: 500; color: #ff6b6b; margin-bottom: 5px;">Obstacles:</div>
      <div id="moveAwayText" style="color: #666; font-size: 14px; line-height: 1.5;"></div>
    </div>
    
    <div id="dailyHabitsSection" style="margin-bottom: 15px;">
      <div style="font-weight: 500; color: #51cf66; margin-bottom: 5px;">Systems:</div>
      <div id="dailyHabitsText" style="color: #666; font-size: 14px; line-height: 1.5;"></div>
    </div>
  </div>
  
  <script src="firebase-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
