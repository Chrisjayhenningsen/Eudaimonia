<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="ui.css">
  <style>
    body {
      width: 500px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      color: #333;
    }
    
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .systems-section {
      margin-bottom: 30px;
    }
    
    .systems-section h2 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #1c7a41;
    }
    
    .system-item {
      background: #f9f9f9;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border-left: 4px solid #1c7a41;
    }
    
    .system-text {
      color: #333;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    
    .completion-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .completion-radio {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 10px 12px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      color: #333;
      transition: all 0.2s;
    }
    
    .completion-radio:hover {
      border-color: #2a68bd;
      background: #f6faff;
    }
    
    .completion-radio.selected {
      border-color: #1c7a41;
      background: #e7f7ec;
    }
    
    .completion-radio input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
    }
    
    .completion-radio label {
      cursor: pointer;
      margin: 0;
      flex-grow: 1;
    }
    
    .reflection-area {
      margin-top: 12px;
      display: none;
    }
    
    .reflection-area.show {
      display: block;
    }
    
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
    }
    
    textarea:focus {
      outline: none;
      border-color: #1c7a41;
    }
    
    .reflection-label {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      display: block;
    }
    
    button {
  padding: 12px 24px;
  width: 100%;
  margin-top: 10px;
    }
    
    
    .button-secondary {
  margin-top: 0;
    }
    
    
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }
    
    .info-box {
      background: #eef5fe;
      border: 2px solid #2a68bd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    .info-box p {
      margin: 0;
      color: #333;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .token-note {
      color: #2a68bd;
      font-weight: 500;
      margin-top: 8px;
    }

    .adjust-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .adjust-label {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      display: block;
    }

    .adjust-radio {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 12px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      transition: all 0.2s;
    }

    .adjust-radio:hover {
      border-color: #a3610a;
      background: #fdf2e3;
    }

    .adjust-radio.selected {
      border-color: #a3610a;
      background: #fdf2e3;
    }

    .adjust-radio input[type="radio"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>✓ Check In</h1>
  <p class="subtitle">Review your systems and reflect on your progress</p>
  
  <div class="info-box" id="tokenInfo">
    <p>Mark your systems as complete, or reflect on why you didn't complete them.</p>
    <p class="token-note" id="tokenMessage"></p>
  </div>
  
  <div class="systems-section">
    <h2>Your Systems</h2>
    <div id="systemsList">
      <!-- Systems will be populated here -->
    </div>
  </div>
  
  <div class="button-group">
    <button class="button-secondary" id="cancelBtn">Cancel</button>
    <button id="saveBtn" style="flex: 2;">Save Check-In</button>
  </div>
  
  <script src="firebase-config.js"></script>
  <script src="checkin.js"></script>
</body>
</html>
